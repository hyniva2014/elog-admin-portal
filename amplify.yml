version: 1

frontend:
  phases:
    preBuild:
      commands:
        - echo "Using Node 20"
        - nvm install 20
        - nvm use 20
        - npm install

    build:
      commands:
        - echo "Current branch: $AWS_BRANCH"
        - ls -la

        - |
          if [ "$AWS_BRANCH" = "preprod" ] && [ -f ".env.preprod" ]; then
            echo "Using PREPROD environment"
            cp .env.preprod .env.production
          elif [ "$AWS_BRANCH" = "main" ] && [ -f ".env.production" ]; then
            echo "Using PROD environment"
            cp .env.production .env.production
          else
            echo "Using DEFAULT environment"
          fi

        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
