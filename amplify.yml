version: 1

frontend:
  phases:
    preBuild:
      commands:
        nvm install 20
        - nvm use 20
        # - nvm use 18 || nvm install 18
        # - npm install

    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
