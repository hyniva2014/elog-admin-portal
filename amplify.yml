version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 18 || nvm install 18
        - node -v
        - npm -v
        - rm -rf node_modules package-lock.json
        - npm install

    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*