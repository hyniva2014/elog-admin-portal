version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm install --script-shell=/bin/bash

    build:
      commands:
        - npm run build --script-shell=/bin/bash

  artifacts:
    baseDirectory: dist
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
